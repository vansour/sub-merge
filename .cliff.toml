[changelog]
header = """
# Changelog

本文件由 git-cliff 在每次发版时自动更新（.github/workflows/release.yml）。请勿手工编辑。
"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}({{ commit.scope }}) {% endif %}{{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/vansour/sub-merge/commit/{{ commit.id }})){% endfor %}
{% endfor %}
"""
trim = true
postprocessors = []
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = ".*", group = "Chores" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
skip_tags = ""
ignore_tags = ""
sort_commits = "oldest"
