# sub-merge docker compose 部署
#
# 用法：
#   docker compose up -d --build
# 数据持久化在 named volume submerge-data（/app/data，SQLite 文件 submerge.db）。
#
# 环境变量与镜像内默认值一致，按需覆盖（见 README「环境变量」表）。

services:
  sub-merge:
    build: .
    image: sub-merge:latest
    container_name: sub-merge
    ports:
      - "8080:8080"
    volumes:
      - submerge-data:/app/data
    environment:
      PORT: 8080
      DATABASE_PATH: /app/data/submerge.db
      CONCURRENCY: 8
      TIMEOUT_SECS: 15
      MAX_NODES: 2000
    restart: unless-stopped

volumes:
  submerge-data:
