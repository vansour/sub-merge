<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sub-merge 管理</title>
  <style>
    /* ========== 设计 tokens：浅色（默认） ========== */
    :root {
      --bg: #f7f8fa; --bg-elevated: #ffffff; --bg-soft: #eef0f3;
      --card: #ffffff; --text: #17181c; --text-secondary: #5f6672;
      --text-tertiary: #9ca3af; --border: #e4e7ec;
      --accent: #6366f1; --accent-hover: #4f46e5; --accent-contrast: #ffffff;
      --accent-soft: #eef0ff; --success: #16a34a; --success-soft: #e9f9ef;
      --danger: #dc2626; --danger-soft: #fdecec; --danger-btn: #dc2626;
      --danger-btn-hover: #b91c1c; --warning: #b45309; --warning-soft: #fdf3e3;
      --shadow-card: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --proto-0-bg: #dcfce7; --proto-0-fg: #15803d;
      --proto-1-bg: #e0e7ff; --proto-1-fg: #4338ca;
      --proto-2-bg: #ede9fe; --proto-2-fg: #6d28d9;
      --proto-3-bg: #ffedd5; --proto-3-fg: #c2410c;
      --proto-4-bg: #fce7f3; --proto-4-fg: #be185d;
      --proto-5-bg: #ccfbf1; --proto-5-fg: #0f766e;
      --ring: color-mix(in srgb, var(--accent) 50%, transparent);
      --overlay: rgba(0,0,0,.45);
      --skeleton-bg: var(--bg-soft);
      --gradient-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }
    /* ========== 设计 tokens：深色（显式 data-theme="dark"） ========== */
    :root[data-theme="dark"] {
      --bg: #0e1013; --bg-elevated: #13151b; --bg-soft: #1d2128;
      --card: #17191f; --text: #e6e8ee; --text-secondary: #9aa1ad;
      --text-tertiary: #636b78; --border: #262a33;
      --accent: #818cf8; --accent-hover: #a5b4fc; --accent-contrast: #0b1220;
      --accent-soft: #1c1f3d; --success: #4ade80; --success-soft: #12301e;
      --danger: #f87171; --danger-soft: #331c1e; --danger-btn: #932727;
      --danger-btn-hover: #a83434; --warning: #fbbf24; --warning-soft: #322712;
      --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
      --proto-0-bg: #10291b; --proto-0-fg: #6ee7a0;
      --proto-1-bg: #1e1b4b; --proto-1-fg: #a5b4fc;
      --proto-2-bg: #231c3e; --proto-2-fg: #c4b5fd;
      --proto-3-bg: #291c10; --proto-3-fg: #fdba74;
      --proto-4-bg: #2c1626; --proto-4-fg: #f9a8d4;
      --proto-5-bg: #0e2a26; --proto-5-fg: #5eead4;
      --ring: color-mix(in srgb, var(--accent) 50%, transparent);
      --overlay: rgba(0,0,0,.45);
      --skeleton-bg: var(--bg-soft);
      --gradient-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
    }
    /* ========== 设计 tokens：深色（system 或未设置时跟随系统） ========== */
    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"], :root:not([data-theme]) {
        /* 与 data-theme="dark" 块完全相同的变量值（复制粘贴） */
        --bg: #0e1013; --bg-elevated: #13151b; --bg-soft: #1d2128;
        --card: #17191f; --text: #e6e8ee; --text-secondary: #9aa1ad;
        --text-tertiary: #636b78; --border: #262a33;
        --accent: #818cf8; --accent-hover: #a5b4fc; --accent-contrast: #0b1220;
        --accent-soft: #1c1f3d; --success: #4ade80; --success-soft: #12301e;
        --danger: #f87171; --danger-soft: #331c1e; --danger-btn: #932727;
        --danger-btn-hover: #a83434; --warning: #fbbf24; --warning-soft: #322712;
        --shadow-card: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
        --proto-0-bg: #10291b; --proto-0-fg: #6ee7a0;
        --proto-1-bg: #1e1b4b; --proto-1-fg: #a5b4fc;
        --proto-2-bg: #231c3e; --proto-2-fg: #c4b5fd;
        --proto-3-bg: #291c10; --proto-3-fg: #fdba74;
        --proto-4-bg: #2c1626; --proto-4-fg: #f9a8d4;
        --proto-5-bg: #0e2a26; --proto-5-fg: #5eead4;
        --ring: color-mix(in srgb, var(--accent) 50%, transparent);
        --overlay: rgba(0,0,0,.45);
        --skeleton-bg: var(--bg-soft);
        --gradient-accent: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      }
    }
    /* ========== 主题切换过渡（一次性 class，theme.rs 触发） ========== */
    html.theme-transition, html.theme-transition body {
      transition: background-color .2s ease, color .2s ease;
    }
    /* ========== 主题切换器（侧边栏底部三态分段按钮） ========== */
    .theme-switcher {
      display: flex; gap: 4px; padding: 4px; margin: 0 10px 6px;
      background: var(--bg-soft); border-radius: 8px;
    }
    .theme-switcher .seg {
      flex: 1; display: inline-flex; align-items: center; justify-content: center;
      border: none; background: none; color: var(--text-tertiary);
      padding: 5px 0; border-radius: 6px; cursor: pointer;
      transition: background-color .15s ease, color .15s ease;
    }
    .theme-switcher .seg:hover { color: var(--text); }
    .theme-switcher .seg.active { background: var(--card); color: var(--accent); box-shadow: var(--shadow-card); }

    /* ========== 基础 ========== */
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text);
      font-size: 14px; -webkit-font-smoothing: antialiased;
      transition: background-color .15s ease, color .15s ease;
    }
    .mono { font-family: var(--font-mono); font-size: 13px; }

    /* ========== 布局：侧边栏 + 主内容 ========== */
    .app-shell { display: flex; min-height: 100vh; }
    .sidebar {
      width: 220px; flex-shrink: 0; height: 100vh; position: sticky; top: 0;
      background: var(--bg-elevated); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 16px 12px; gap: 4px;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 16px; font-size: 16px; font-weight: 600; }
    .sidebar-brand svg { color: var(--accent); filter: drop-shadow(0 1px 2px rgba(99,102,241,.35)); }
    .nav { display: flex; flex-direction: column; gap: 2px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px; width: 100%;
      padding: 9px 10px; border: none; border-radius: 8px; background: none;
      color: var(--text-secondary); font-size: 14px; font-family: inherit; cursor: pointer; text-align: left;
      position: relative; transition: background-color .15s cubic-bezier(.2,.8,.2,1), color .15s cubic-bezier(.2,.8,.2,1), padding-left .15s cubic-bezier(.2,.8,.2,1);
    }
    .nav-item:hover { background: var(--bg-soft); color: var(--text); padding-left: 13px; }
    .nav-item.active {
      background: var(--accent-soft); color: var(--accent); font-weight: 500; padding-left: 13px;
    }
    .nav-item.active::before {
      content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px;
      border-radius: 3px; background: var(--accent);
    }
    .sidebar-footer { border-top: 1px solid var(--border); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .sidebar-version { font-size: 12px; color: var(--text-tertiary); padding: 0 10px; display: flex; align-items: center; gap: 6px; }
    .sidebar-version::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 0 rgba(22,163,74,.5); animation: breathe 2.4s ease-in-out infinite; }
    @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 rgba(22,163,74,.45); } 50% { box-shadow: 0 0 0 4px rgba(22,163,74,0); } }
    .main { flex: 1; min-width: 0; padding: 28px 32px; }
    .page-wrap { max-width: 960px; margin: 0 auto; }
    .page-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; gap: 12px; }
    .page-title { font-size: 20px; font-weight: 600; margin: 0; }
    .nav-group { display: flex; flex-direction: column; gap: 2px; }
    .nav-group-head { justify-content: flex-start; }
    .nav-group-head span:last-child { margin-left: auto; }
    .nav-chevron { display: inline-flex; transition: transform .15s ease; color: var(--text-tertiary); }
    .nav-chevron.open { transform: rotate(90deg); }
    .nav-group-children { display: flex; flex-direction: column; gap: 2px; padding-left: 12px; overflow: hidden; transition: max-height .2s cubic-bezier(.2,.8,.2,1); }
    /* 展开态：max-height 取足够大值（约 4 层导航高度）；收起时 dioxus 条件渲染直接摘除，过渡由展开路径的 max-height 动画承担 */
    .nav-group-children { max-height: 320px; }

    /* ========== 滚动条美化 ========== */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-tertiary) 40%, transparent); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text-tertiary) 60%, transparent); }
    ::-webkit-scrollbar-track { background: transparent; }
    * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text-tertiary) 40%, transparent) transparent; }

    /* ========== 页面切换动画（挂载时播放，Task 4 加 class） ========== */
    @keyframes page-enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .page-enter { animation: page-enter .2s cubic-bezier(.2,.8,.2,1); }

    /* ========== 按钮 ========== */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      border: none; border-radius: 8px; padding: 8px 14px;
      font-size: 14px; font-weight: 500; font-family: inherit; cursor: pointer;
      transition: background-color .15s cubic-bezier(.2,.8,.2,1), color .15s cubic-bezier(.2,.8,.2,1),
                  box-shadow .15s cubic-bezier(.2,.8,.2,1), transform .15s cubic-bezier(.2,.8,.2,1);
    }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .55; cursor: not-allowed; }
    .btn:focus-visible, .nav-item:focus-visible, input:focus-visible {
      outline: 2px solid var(--ring); outline-offset: 2px;
    }
    .btn-primary { background: var(--accent); color: var(--accent-contrast); box-shadow: 0 1px 2px rgba(99,102,241,.3); }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled:hover { background: var(--accent); }
    .btn-secondary { background: var(--bg-soft); color: var(--text); }
    .btn-secondary:hover { background: var(--border); }
    .btn-danger { background: var(--danger-btn); color: #fff; }
    .btn-danger:hover { background: var(--danger-btn-hover); }
    .btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-soft); color: var(--text); }
    .btn-sm { padding: 4px 10px; font-size: 13px; border-radius: 6px; }
    .btn.checked { background: var(--success-soft); color: var(--success); border-color: transparent; }

    /* ========== 表单 ========== */
    .form-row { display: flex; gap: 12px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .field label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .field input {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-size: 14px; color: var(--text); font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field input::placeholder { color: var(--text-tertiary); }
    .field input:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .field input.mono { font-family: var(--font-mono); }
    .field textarea, textarea.clash-template {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-size: 13px; color: var(--text); font-family: var(--font-mono);
      line-height: 1.5; resize: vertical; box-sizing: border-box;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    textarea.clash-template:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .field select {
      width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 10px; font-size: 14px; color: var(--text); font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .field select:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--ring);
    }
    .error-text { font-size: 12.5px; color: var(--danger); margin: 4px 0 0; }

    /* ========== 卡片 ========== */
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-card); transition: box-shadow .2s cubic-bezier(.2,.8,.2,1); }
    .card:hover { box-shadow: 0 4px 12px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.06); }
    .card + .card { margin-top: 16px; }
    .card-title { font-size: 15px; font-weight: 600; margin: 0 0 14px; }
    .card-foot { margin-top: 12px; display: flex; justify-content: flex-end; }
    .subtle { font-size: 12.5px; color: var(--text-secondary); margin: 0 0 10px; line-height: 1.5; }

    /* ========== 表格 ========== */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-secondary); padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr { transition: background-color .1s ease; }
    tbody tr:hover { background: var(--bg-soft); }
    .cell-name { font-weight: 500; white-space: nowrap; }
    .cell-url {
      font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary);
      max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .actions { display: flex; gap: 6px; justify-content: flex-end; }

    /* ========== 徽章 ========== */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .badge.on { background: var(--success-soft); color: var(--success); }
    .badge.off { background: var(--bg-soft); color: var(--text-secondary); }
    .badge.info { background: var(--accent-soft); color: var(--accent); }
    .proto { display: inline-block; padding: 2px 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 11.5px; }
    .proto-0 { background: var(--proto-0-bg); color: var(--proto-0-fg); }
    .proto-1 { background: var(--proto-1-bg); color: var(--proto-1-fg); }
    .proto-2 { background: var(--proto-2-bg); color: var(--proto-2-fg); }
    .proto-3 { background: var(--proto-3-bg); color: var(--proto-3-fg); }
    .proto-4 { background: var(--proto-4-bg); color: var(--proto-4-fg); }
    .proto-5 { background: var(--proto-5-bg); color: var(--proto-5-fg); }

    /* ========== 统计徽章 ========== */
    .stat-badge {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: var(--accent-contrast);
      font-size: 12.5px; font-weight: 500; padding: 4px 12px; border-radius: 999px;
      margin-left: 10px; white-space: nowrap;
    }
    .mini-badge {
      display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px;
      font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    }
    .mini-badge.off { background: var(--bg-soft); color: var(--text-secondary); }
    /* 协议色：沿用 .proto-N 的 bg/fg 变量 */
    .mini-badge.proto-0 { background: var(--proto-0-bg); color: var(--proto-0-fg); }
    .mini-badge.proto-1 { background: var(--proto-1-bg); color: var(--proto-1-fg); }
    .mini-badge.proto-2 { background: var(--proto-2-bg); color: var(--proto-2-fg); }
    .mini-badge.proto-3 { background: var(--proto-3-bg); color: var(--proto-3-fg); }
    .mini-badge.proto-4 { background: var(--proto-4-bg); color: var(--proto-4-fg); }
    .mini-badge.proto-5 { background: var(--proto-5-bg); color: var(--proto-5-fg); }

    /* ========== Toast ========== */
    .toast-stack { position: fixed; top: 16px; right: 16px; z-index: 100; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
    .toast {
      pointer-events: auto; display: flex; align-items: center; gap: 10px;
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px 14px; font-size: 13.5px; max-width: 360px;
      box-shadow: 0 4px 12px rgba(0,0,0,.15); animation: toast-in .15s ease-out;
    }
    .toast.success { border-left: 3px solid var(--success); }
    .toast.error { border-left: 3px solid var(--danger); }
    .toast.info { border-left: 3px solid var(--accent); }
    @keyframes toast-in { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
    .toast-close { border: none; background: none; color: var(--text-tertiary); cursor: pointer; font-size: 14px; padding: 0 0 0 6px; margin-left: auto; display: flex; }

    /* ========== 确认弹窗 ========== */
    .modal-overlay { position: fixed; inset: 0; background: var(--overlay); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 200; padding: 16px; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(0,0,0,.25); animation: modal-in .16s cubic-bezier(.2,.8,.2,1); }
    @keyframes modal-in { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
    .modal-title { font-size: 16px; font-weight: 600; margin: 0 0 8px; }
    .modal-message { font-size: 14px; color: var(--text-secondary); margin: 0 0 20px; line-height: 1.6; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

    /* ========== 空状态 ========== */
    .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 36px 20px; text-align: center; color: var(--text-secondary); }
    .empty-icon-circle {
      width: 52px; height: 52px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .page-loading { display: flex; justify-content: center; padding: 80px 0; color: var(--muted); }
    .empty-title { font-size: 14px; color: var(--text); font-weight: 600; }
    .empty-hint { font-size: 12.5px; max-width: 260px; line-height: 1.5; }
    .empty .btn { margin-top: 6px; }

    /* ========== 骨架屏 ========== */
    .skeleton-block {
      height: 12px; border-radius: 6px;
      background: linear-gradient(90deg, var(--skeleton-bg) 25%, color-mix(in srgb, var(--skeleton-bg) 60%, var(--text-tertiary) 12%) 37%, var(--skeleton-bg) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .skeleton-block + .skeleton-block { margin-top: 0; }

    /* ========== 列表条目进入（stagger，delay 由组件内联 style 提供） ========== */
    @keyframes row-enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .row-enter { animation: row-enter .25s cubic-bezier(.2,.8,.2,1) backwards; }

    /* ========== 动效降级 ========== */
    @media (prefers-reduced-motion: reduce) {
      .skeleton-block { animation: none; }
      .row-enter, .page-enter, .modal, .toast { animation: none !important; }
      .nav-item, .btn, .card { transition: none !important; }
      .sidebar-version::before { animation: none; }
    }

    /* ========== 登录页 ========== */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .login-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 36px 32px; width: 100%; max-width: 380px; box-shadow: var(--shadow-card); }
    .login-logo { display: flex; justify-content: center; color: var(--accent); }
    .login-title { font-size: 22px; font-weight: 700; color: var(--text); text-align: center; margin: 12px 0 0; }
    .login-sub { font-size: 13px; color: var(--text-secondary); text-align: center; margin: 6px 0 24px; }
    .login-card .btn { width: 100%; justify-content: center; margin-top: 16px; }

    /* ========== 概览页摘要 ========== */
    .summary-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    .summary-row:last-child { border-bottom: none; }
    .error-line { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; padding: 4px 0; }
    .warning-box { background: var(--warning-soft); border: 1px solid color-mix(in srgb, var(--warning) 35%, transparent); border-radius: 8px; padding: 10px 14px; }

    /* ========== 配置页 ========== */
    .link-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .link-row:last-child { border-bottom: none; }
    .link-label { font-weight: 500; font-size: 13.5px; flex-shrink: 0; width: 76px; }
    .switch-row { display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .switch-row input { accent-color: var(--accent); }

    /* ========== 组合订阅页 ========== */
    .combined-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .combined-row:last-child { border-bottom: none; }
    .combined-info { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
    .combined-name { font-family: var(--font-mono); font-size: 13.5px; font-weight: 500; white-space: nowrap; }
    .combined-links { display: flex; gap: 6px; margin-left: auto; }
    .member-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13.5px; cursor: pointer; }
    .member-row input { accent-color: var(--accent); }
    .member-row .badge { margin-left: 2px; }
    .member-row .badge.off { margin-left: auto; }
    .link-url { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 12.5px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .token-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .token-row + .token-row { border-top: 1px solid var(--border); }
    .token-label { font-size: 13.5px; color: var(--text-secondary); width: 84px; flex-shrink: 0; }
    .token-value { flex: 1; min-width: 0; font-family: var(--font-mono); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ========== 图标动画 ========== */
    .spinner { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ========== 响应式：桌面 ≥900px 侧栏常驻；<900px 汉堡抽屉 ========== */
    .topbar { display: none; }

    @media (max-width: 900px) {
      .app-shell { flex-direction: column; }
      .topbar {
        display: flex; align-items: center; gap: 10px;
        position: sticky; top: 0; z-index: 30;
        background: var(--bg-elevated); border-bottom: 1px solid var(--border);
        padding: 8px 12px;
      }
      .topbar-brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .topbar-brand svg { color: var(--accent); }
      .topbar-brand::after {
        content: ""; width: 7px; height: 7px; border-radius: 50%;
        background: var(--success); margin-left: 2px;
        animation: breathe 2.4s ease-in-out infinite;
      }
      .topbar-menu { padding: 6px; }
      .sidebar {
        position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
        z-index: 50; transform: translateX(-100%);
        transition: transform .2s ease; border-right: 1px solid var(--border);
      }
      .sidebar.open { transform: translateX(0); }
      .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
      .main { padding: 12px; }
      .page-head { flex-direction: column; align-items: flex-start; }
      .form-row { flex-direction: column; align-items: stretch; }
      .form-row .btn { width: 100%; justify-content: center; }
      .sidebar-version { display: none; }
    }

    /* ========== 触控目标（移动端） ========== */
    @media (max-width: 900px) {
      .nav-item { min-height: 44px; }
      .btn { min-height: 44px; }
      .btn-sm { min-height: 38px; }
    }

    /* ========== 表格（窄屏降噪 + 保持横滚） ========== */
    @media (max-width: 900px) {
      .table-wrap { margin: 0 -12px; padding: 0 12px; } /* 对齐 .main 边距 */
      th, td { padding: 8px 10px; }
      table { font-size: 12.5px; }
      .cell-url { max-width: 180px; }
    }

    /* ========== 操作行 wrap ========== */
    @media (max-width: 900px) {
      .combined-row, .link-row, .token-row { flex-wrap: wrap; gap: 8px; }
      .combined-links { margin-left: 0; width: 100%; justify-content: flex-start; flex-wrap: wrap; }
      .link-url { flex-basis: 100%; }
      .token-value { flex-basis: 100%; }
    }

    /* ========== 弹窗（窄屏 bottom-sheet 风格） ========== */
    @media (max-width: 600px) {
      .modal-overlay { padding: 0; align-items: flex-end; }
      .modal { max-width: none; border-radius: 16px 16px 0 0; padding: 20px 16px calc(16px + env(safe-area-inset-bottom)); }
    }

    /* ========== Toast（窄屏留边避安全区） ========== */
    @media (max-width: 600px) {
      .toast-stack { left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); }
      .toast { max-width: none; }
    }

    /* ========== 安全区（顶栏/抽屉） ========== */
    @media (max-width: 900px) {
      .topbar { padding-top: calc(8px + env(safe-area-inset-top)); }
      .sidebar { padding-top: calc(16px + env(safe-area-inset-top)); padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      .main { padding-left: calc(12px + env(safe-area-inset-left)); padding-right: calc(12px + env(safe-area-inset-right)); }
    }

    /* ========== 标题/按钮区 ========== */
    @media (max-width: 900px) {
      .page-title { font-size: 18px; }
      .page-head { gap: 10px; }
      .page-head .btn { width: 100%; justify-content: center; }
      .card { padding: 14px; }
    }

    /* ========== 订阅源表卡片化（窄屏，data-label 呈现字段名） ========== */
    @media (max-width: 600px) {
      .table-wrap-sources table, .table-wrap-sources thead, .table-wrap-sources tbody { display: block; }
      .table-wrap-sources thead { display: none; }
      .table-wrap-sources tr {
        display: block; border: 1px solid var(--border); border-radius: 10px;
        padding: 6px 12px; margin-bottom: 10px; background: var(--card);
      }
      .table-wrap-sources td {
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
        border: none; padding: 8px 0; text-align: right;
      }
      .table-wrap-sources td::before {
        content: attr(data-label); font-size: 12px; font-weight: 500;
        color: var(--text-tertiary); flex-shrink: 0;
      }
      .table-wrap-sources td.cell-actions { justify-content: flex-end; }
      .table-wrap-sources td.cell-actions::before { display: none; }
      .table-wrap-sources .cell-url { max-width: none; }
    }

    /* ========== 全屏对话框（预览/编辑） ========== */
    .fullscreen-modal {
      position: fixed; inset: 0; z-index: 300;
      background: var(--bg); display: flex; flex-direction: column;
    }
    .fullscreen-modal-head {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 14px 20px; border-bottom: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    .fullscreen-modal-title { font-size: 16px; font-weight: 600; margin: 0; }
    .fullscreen-modal-body { flex: 1; overflow-y: auto; padding: 20px; }
    .fullscreen-modal-foot {
      display: flex; justify-content: flex-end; gap: 8px;
      padding: 12px 20px; border-top: 1px solid var(--border);
      background: var(--bg-elevated);
    }
    @media (max-width: 900px) {
      .fullscreen-modal-head { padding-top: calc(14px + env(safe-area-inset-top)); }
      .fullscreen-modal-foot { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
