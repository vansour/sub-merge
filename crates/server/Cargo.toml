[package]
name = "server"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true

[dependencies]
proxy-core = { path = "../proxy-core" }
axum = { version = "0.8", features = ["json", "macros", "query"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "derive"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
tower-http = { version = "0.7", features = ["cors", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.10"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
const-hex = "1"
chrono = "0.4"
mime_guess = { package = "mime_guess2", version = "2.3" }
argon2 = { version = "0.5", features = ["std"] }
sha2 = "0.11"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
base64 = "0.23"
