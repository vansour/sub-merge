name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  web:
    name: web (dx build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install dx (prebuilt, sha256 pinned)
        run: |
          curl -sSLo /tmp/dx.zip https://github.com/DioxusLabs/dioxus/releases/download/v0.8.0-alpha.1/dx-x86_64-unknown-linux-gnu.zip
          echo "4aac287c2f66ef001f34e364aa5289fdf5f556cfb22e9a54cf388f82946a0edb  /tmp/dx.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/dx.zip -d /usr/local/bin
      - name: build web
        working-directory: crates/server/web
        run: |
          dx build --web --release
          test -d target/dx/submerge-web/release/web/public || exit 1

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t sub-merge .
